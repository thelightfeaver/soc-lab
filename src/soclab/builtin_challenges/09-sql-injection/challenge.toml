description = '''
## Escenario

La tienda online reportó lentitud y respuestas inusualmente grandes en `/productos.php`. Los parámetros de las peticiones llegan URL-encoded.

## Objetivo

Determina el nombre de la tabla de negocio cuyos datos se llevó el atacante.

## Evidencias

En el entorno de análisis, dentro de `/challenge`, o con el botón *Abrir carpeta de evidencias*:

- `access.log`

## Formato de la flag

`SOC{nombre_tabla}`
'''

