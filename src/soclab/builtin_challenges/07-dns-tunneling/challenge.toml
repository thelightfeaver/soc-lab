description = '''
## Escenario

El resolver interno muestra consultas TXT con subdominios largos y aleatorios hacia un dominio externo. Sospechamos exfiltración por túnel DNS.

## Objetivo

Reconstruye la información exfiltrada. La flag está dentro de los datos.

## Evidencias

En el entorno de análisis, dentro de `/challenge`, o con el botón *Abrir carpeta de evidencias*:

- `dns.log`

## Formato de la flag

`SOC{...}`
