case_sensitive = false
description = '''
## Escenario

El EDR exportó eventos de creación de procesos (4688) de varias estaciones. Una de ellas ejecutó PowerShell oculto con un comando codificado.

## Objetivo

Decodifica el comando malicioso y encuentra el dominio desde el que se descarga la siguiente etapa.

## Artefactos

Dentro del contenedor en `/challenge` (o con el botón *Abrir artefactos*):

- `process_events.jsonl`

## Formato de la flag

`SOC{dominio}`
'''

[container]
containerfile = "Containerfile"

[[hints]]
text = "Busca los parámetros -enc / -EncodedCommand."
cost = 10

[[hints]]
text = "PowerShell usa Base64 sobre UTF-16LE: `base64 -d | iconv -f utf-16le` o Python."
cost = 20
