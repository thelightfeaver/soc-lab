description = '''
## Escenario

RRHH recibió una 'factura' con un adjunto HTA. Alguien lo abrió. Tienes el correo, los logs del proxy y los logs del DHCP (las IPs cambian de equipo).

## Objetivo

Determina el **hostname** del equipo que descargó con éxito la segunda etapa del ataque.

## Artefactos

Dentro del contenedor en `/challenge` (o con el botón *Abrir artefactos*):

- `correo_factura.eml`
- `proxy.log`
- `dhcp.log`

## Formato de la flag

`SOC{HOSTNAME}`
'''

