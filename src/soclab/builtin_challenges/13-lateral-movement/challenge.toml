description = '''
## Escenario

La cuenta de servicio `adm_backup` fue comprometida desde la estación de `lgarcia`. Normalmente esa cuenta solo se usa desde el servidor de backups por las noches.

## Objetivo

Reconstruye la ruta completa del atacante, desde el equipo inicial hasta el último equipo alcanzado, en orden cronológico.

## Artefactos

Dentro del contenedor en `/challenge` (o con el botón *Abrir artefactos*):

- `logons.jsonl`
- `activos.csv`

## Formato de la flag

`SOC{HOST1>HOST2>HOST3>...}`
'''

