## Escenario

El firewall perimetral exportó tres horas de conexiones salientes. Un implante suele 'llamar a casa' a intervalos regulares con poco tráfico.

## Objetivo

Encuentra el destino (IP:puerto) del beaconing.

## Artefactos

Dentro del contenedor en `/challenge` (o con el botón *Abrir artefactos*):

- `conexiones.csv`

## Formato de la flag

`SOC{IP:puerto}`
