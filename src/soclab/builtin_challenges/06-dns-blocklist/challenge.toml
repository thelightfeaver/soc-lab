description = '''
## Escenario

Threat Intel actualizó la blocklist de dominios. Necesitamos saber si algún equipo interno resolvió alguno de ellos durante el día.

## Objetivo

Encuentra la IP interna que consultó un dominio presente en la blocklist (recuerda que la lista bloquea también los subdominios).

## Evidencias

En el entorno de análisis, dentro de `/challenge`, o con el botón *Abrir carpeta de evidencias*:

- `dns.log`
- `blocklist.txt`

## Formato de la flag

`SOC{IP}`
'''

