description = '''
## Escenario

Sysmon (evento 1) registró un PowerShell oculto descargando código desde Internet en `WS-007`. Necesitamos el vector inicial.

## Objetivo

Sigue la cadena de procesos padre e identifica el nombre del documento de Office que originó la ejecución.

## Evidencias

En el entorno de análisis, dentro de `/challenge`, o con el botón *Abrir carpeta de evidencias*:

- `sysmon_process_create.jsonl`

## Formato de la flag

`SOC{nombre_documento.ext}`
'''

