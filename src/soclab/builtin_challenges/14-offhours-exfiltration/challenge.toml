description = '''
## Escenario

Tenemos tres días de NetFlow. La red interna es `10.0.0.0/8` y el horario laboral es de 07:00 a 20:00 (UTC). Hay backups enormes, pero son legítimos o internos.

## Objetivo

Identifica el host interno que envió más bytes hacia IPs externas fuera del horario laboral.

## Artefactos

Dentro del contenedor en `/challenge` (o con el botón *Abrir artefactos*):

- `netflow.csv`

## Formato de la flag

`SOC{IP}`
'''

