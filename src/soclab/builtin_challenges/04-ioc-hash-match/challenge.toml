## Escenario

Recibimos un feed de IOCs de un CERT aliado. El inventario de binarios de una estación sospechosa fue exportado por el EDR.

## Objetivo

Encuentra el binario del inventario cuyo hash aparece en el feed.

## Evidencias

En el entorno de análisis, dentro de `/challenge`, o con el botón *Abrir carpeta de evidencias*:

- `inventario_binarios.csv`
- `feed_iocs.csv`

## Formato de la flag

`SOC{nombre_del_archivo.exe}`
