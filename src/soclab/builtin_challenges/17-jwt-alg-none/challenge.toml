case_sensitive = false
description = '''
## Escenario

La API registró una exportación masiva de datos desde `/api/admin/export`. El registro incluye el token Bearer de cada petición.

## Objetivo

Identifica la identidad (`sub`) con la que el atacante logró exportar los datos usando un token sin firma.

## Evidencias

En el entorno de análisis, dentro de `/challenge`, o con el botón *Abrir carpeta de evidencias*:

- `api_access.log`

## Formato de la flag

`SOC{sub}`
'''

