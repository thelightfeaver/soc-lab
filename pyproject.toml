[project]
name = "soclab"
version = "0.1.0"
description = "Laboratorio SOC con 20 retos en contenedores Podman y una UI de escritorio en PySide6"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "thelightfeaver" }]
keywords = ["soc", "blue-team", "ctf", "podman", "pyside6", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "peewee>=4.5,<5",
    "pyside6>=6.10,<7",
]

[project.scripts]
soclab = "soclab.cli:main"

[project.urls]
Repository = "https://github.com/thelightfeaver/soc-lab"
Documentation = "https://github.com/thelightfeaver/soc-lab/tree/main/docs"

[dependency-groups]
dev = [
    "commitizen>=4.9",
    "prek>=0.2",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-qt>=4.5",
    "ruff>=0.14",
]
release = [
    "pyinstaller>=6.16",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "DTZ", "E", "EM", "ERA", "F", "FBT",
    "I", "ISC", "LOG", "N", "PERF", "PIE", "PL", "PT", "PTH", "Q", "RET",
    "RSE", "RUF", "S", "SIM", "SLF", "T20", "TC", "TRY", "UP", "W",
]
ignore = [
    "PLR0913",  # Qt constructors y builders de retos tienen muchos parámetros
    "TRY003",   # mensajes de error descriptivos en línea
    "RUF001",   # textos en español con caracteres ambiguos (é, ñ...)
    "RUF002",
    "RUF003",
    "EM101",    # mensajes de excepción en línea (legibles en español)
    "EM102",
    "TC001",    # Python 3.14 evalúa anotaciones de forma diferida
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S603", "S607", "PLR2004", "ANN", "SLF001", "FBT", "ARG", "PT018"]
"scripts/**" = ["S311", "S603", "PLR2004", "PLR0915", "PLR0917", "PERF401", "T20", "E501"]
# Constructores de widgets Qt y overrides (rowCount, data...) son largos/camelCase por diseño.
"src/soclab/ui/**" = ["N802", "PLR0915"]
"src/soclab/manifest.py" = ["PLR0912", "PLR0915"]  # validador lineal: un bloque por campo

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not podman'"
qt_api = "pyside6"
markers = ["podman: requiere podman funcionando (se omite si no está disponible)"]

[tool.coverage.run]
source = ["soclab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- commitizen
[tool.commitizen]
name = "cz_conventional_commits"
# Fuente única de versión: pyproject.toml (+ uv.lock). `cz bump` también
# actualiza __version__, crea el tag vX.Y.Z y regenera CHANGELOG.md.
version_provider = "uv"
version_scheme = "pep440"
version_files = ["src/soclab/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = true
bump_message = "bump: version $current_version → $new_version"
