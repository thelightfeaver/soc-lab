name: Release

# Dos formas de publicar una versión:
#  1. Actions → Release → Run workflow: commitizen calcula la nueva versión a partir
#     de los commits (o la que elijas), actualiza CHANGELOG.md, crea el tag y publica.
#  2. Local: `uv run cz bump && git push --follow-tags` (el tag dispara este workflow).
on:
  workflow_dispatch:
    inputs:
      increment:
        description: Incremento de versión
        type: choice
        options: [auto, PATCH, MINOR, MAJOR]
        default: auto
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  UV_PYTHON: "3.14"

jobs:
  bump:
    name: Versionar (commitizen)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Configurar identidad de git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: bump
        name: cz bump
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          args=(--yes)
          if [ "$INCREMENT" != "auto" ]; then args+=(--increment "$INCREMENT"); fi
          uv run --only-group dev cz bump "${args[@]}"
          tag="v$(uv run --only-group dev cz version --project)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git push origin HEAD "refs/tags/$tag"

  build:
    name: Binario ${{ matrix.label }}
    needs: bump
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x86_64
          - os: windows-latest
            label: Windows x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Librerías de sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: uv sync --locked --group release
      - name: El tag coincide con la versión del proyecto
        shell: bash
        run: |
          tag="${{ needs.bump.outputs.tag || github.ref_name }}"
          version="v$(uv run cz version --project)"
          echo "tag=$tag proyecto=$version"
          test "$tag" = "$version"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      - name: Empaquetar con PyInstaller
        run: uv run python scripts/build_app.py
      - name: Probar el ejecutable (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/soclab/soclab --version
          ./dist/soclab/soclab validate dist/soclab/_internal/soclab/builtin_challenges
      - uses: actions/upload-artifact@v7
        with:
          name: soclab-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publicar GitHub Release
    needs: [bump, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Notas desde CHANGELOG (commitizen)
        run: |
          tag="${{ needs.bump.outputs.tag || github.ref_name }}"
          uv run --only-group dev cz changelog "${tag#v}" --dry-run > notes.md || true
          {
            echo
            echo "## Descargas"
            echo
            echo "- **Linux x86_64**: \`soclab-${tag#v}-linux-x86_64.tar.gz\` → descomprime y ejecuta \`soclab/soclab\`"
            echo "- **Windows x86_64**: \`soclab-${tag#v}-windows-x86_64.zip\` → descomprime y ejecuta \`soclab\\soclab.exe\`"
            echo
            echo "Requiere [Podman](https://podman.io/docs/installation) para los entornos de análisis."
          } >> notes.md
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.bump.outputs.tag || github.ref_name }}"
          gh release create "$tag" release/* --title "SOC Lab $tag" --notes-file notes.md --verify-tag
